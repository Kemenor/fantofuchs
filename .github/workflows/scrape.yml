name: Scrape programme

# Fantoche moves screenings around in the run-up to the festival, so the
# programme is re-scraped daily and committed. A commit here triggers the Pages
# deploy, which is what actually puts the new data in front of you.
on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC, before anyone is awake in Baden
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - name: Scrape
        env:
          NO_CACHE: '1'
        run: npm run scrape

      # A parse regression would otherwise silently commit an empty programme.
      - name: Sanity-check the result
        run: node scraper/verify.ts

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "Programme unchanged."
            exit 0
          fi

          # Every run rewrites `scrapedAt`, so a diff of that line alone means
          # nothing actually moved. Committing it anyway would put a commit and
          # a deploy in the log every single day and bury the real changes.
          substantive=$(git diff -U0 -- data/ \
            | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' \
            | grep -v '"scrapedAt"' | wc -l)
          if [ "$substantive" -eq 0 ]; then
            echo "Only the scrape timestamp changed."
            git checkout -- data/
            exit 0
          fi
          summary=$(node -e "const f=require('./data/fantoche-2026.json');\
            process.stdout.write(f.blocks.length+' programmes, '+f.showings.length+' screenings')")

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "data: refresh Fantoche programme ($summary)"
          git push
